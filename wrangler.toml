name = "social-scheduler"
main = "src/worker.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "social-scheduler"
database_id = "ae4c3e52-8249-4007-a2fe-e1c1a871d80f"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "social-scheduler-media"

[triggers]
# Every minute — the cron interval *is* the publishing delay, since a post can only go out on the
# tick after its scheduled_for. At */10 a post waited 0-10min (5min on average); at * * * * * the
# worst case is ~60s. Cloudflare's minimum granularity is one minute, so this is the floor without
# moving to a Durable Object alarm per post.
#
# Cost stays at $0: 1440 invocations/day against the free plan's 100k requests, and the poller's
# handful of indexed D1 reads per run is nowhere near the free row quotas. Overlapping runs are
# safe by construction — the post claim and the token-refresh claim are both atomic (worker.ts).
crons = ["* * * * *"]

# Secrets — set with `wrangler secret put NAME`, never committed here:
#   TOKEN_ENCRYPTION_KEY   (openssl rand -base64 32)
#   YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET
#   LINKEDIN_CLIENT_ID / LINKEDIN_CLIENT_SECRET
#   META_APP_ID / META_APP_SECRET
#   PINTEREST_CLIENT_ID / PINTEREST_CLIENT_SECRET
#   TIKTOK_CLIENT_KEY / TIKTOK_CLIENT_SECRET
